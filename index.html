<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мебель на заказ</title>
<meta name="description" content="Мебель на заказ: замер, проект, изготовление и установка. Заказ в WhatsApp или по телефону.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="shaft s1"></div><div class="shaft s2"></div>
  <svg class="saw-blade" id="blade1" viewBox="-110 -110 220 220"></svg>
  <svg class="saw-blade b2" id="blade2" viewBox="-110 -110 220 220"></svg>
  <div id="dust"></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="teeth" width="36" height="22" patternUnits="userSpaceOnUse">
      <polygon points="0,22 36,0 36,22" fill="rgba(255,255,255,.74)"/>
    </pattern>
  </defs>
</svg>

<header class="wrap top">
  <a class="brand" href="#top" aria-label="На главную">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="12" fill="#1F4A3B"/>
      <rect x="12" y="8" width="24" height="31" rx="2" fill="#E9C27A"/>
      <line x1="24" y1="8" x2="24" y2="39" stroke="#1F4A3B" stroke-width="2"/>
      <circle cx="21" cy="24" r="1.9" fill="#1F4A3B"/><circle cx="27" cy="24" r="1.9" fill="#1F4A3B"/>
      <rect x="10" y="39" width="28" height="3" rx="1.5" fill="#E9C27A"/>
    </svg>
    <span class="brand-name" data-bind="name">Мастер Мебель</span>
  </a>
  <a class="top-phone" data-ch="tel" href="#"><span data-bind="phoneText"></span></a>
</header>

<main id="top">
  <div class="wrap">
    <div class="hero">
      <div>
        <h1 data-bind="heroTitle"></h1>
        <p class="lead" data-bind="heroText"></p>
        <div class="cta">
          <a class="btn btn-wa" data-ch="wa" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> WhatsApp</a>
          <a class="btn btn-call" data-ch="tel" href="#"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Позвонить</a>
        </div>
        <p class="note" data-bind="hours"></p>
      </div>

    </div>
  </div>

  <svg class="saw" aria-hidden="true"><rect width="100%" height="22" fill="url(#teeth)"/></svg>
  <section id="works">
    <div class="wrap">
      <h2>Что делаем</h2>
      <p class="sub">Нажмите на карточку — покажем работы нашего мастера.</p>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2>Как работаем</h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section id="order">
    <div class="wrap">
      <h2>Соберите заявку за 10 секунд</h2>
      <div class="order">
        <div>
          <div class="field">
            <span class="lab">Что нужно сделать</span>
            <div class="chips" id="chips"></div>
          </div>
          <div class="pick" id="pick"><img id="pickImg" alt=""><span id="pickLabel"></span></div>
          <div class="field">
            <label class="check"><input type="checkbox" id="measure" checked> Нужен выезд на замер</label>
          </div>
          <div class="field">
            <label for="addr">Адрес или район</label>
            <input type="text" id="addr" autocomplete="street-address" placeholder="Можно не писать сейчас">
          </div>
        </div>

        <div class="panel">
          <span class="lab">Сообщение, которое уйдёт нам</span>
          <div class="bubble" id="bubble"></div>
          <div class="cta">
          <a class="btn btn-wa" data-ch="wa" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> WhatsApp</a>
          <a class="btn btn-call" data-ch="tel" href="#"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Позвонить</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span><b data-bind="name"></b>, <span data-bind="city"></span></span>
    <span data-bind="hours"></span>
  </div>
</footer>

<nav class="bar" aria-label="Быстрая связь">
  <a class="btn btn-wa" data-ch="wa" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> WhatsApp</a>
          <a class="btn btn-call" data-ch="tel" href="#"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Звонок</a>
</nav>

<dialog id="gal" aria-label="Галерея работ">
  <button class="gal-x" id="galX" aria-label="Закрыть">✕</button>
  <div class="gal-img">
    <img id="galImg" alt="">
    <button class="gal-nav prev" id="galPrev" aria-label="Назад">‹</button>
    <button class="gal-nav next" id="galNext" aria-label="Вперёд">›</button>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="gal-foot">
    <div><h3 id="galTitle"></h3><small id="galCount"></small></div>
    <button class="btn btn-brand" id="galOrder" type="button">Хочу такую</button>
  </div>
</dialog>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
